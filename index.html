</head>
<body>
    <!-- Курсор -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
<div class="container">

    <!-- БЛОК 1: ВИЗИТКА -->
    <div class="container">
    <!-- БЛОК 1: ТЫ И ТВОИ СКИЛЛЫ -->
    <div class="card">
        <div class="avatar"><img src="png.jpg"></div>
        <h1 style="font-size: 1.4rem; color: #1d3557; margin-top: 15px;">ДОБРЫЙ ДЕНЬ, ВАНЯ!</h1>
        <p style="color: #666; font-size: 0.85rem; margin-bottom: 20px;">Будущий Fullstack-разработчик.</p>
        <a href="https://t.me" class="btn-send">Написать мне</a>

        <div class="inner-block">
            <h4 style="color: #457b9d; font-size: 0.9rem; margin-bottom: 10px;">МОИ НАВЫКИ</h4>
            <div class="progress-bg"><div class="progress-fill html" style="width: 90%;"></div></div>
            <div class="progress-bg"><div class="progress-fill css" style="width: 80%;"></div></div>
            <div class="progress-bg"><div class="progress-fill js" style="width: 40%;"></div></div>
        </div>
    </div>
</div>
<div class="container">
</div>

    <!-- БЛОК 2: БИЗНЕС -->
    <div class="card">
        <div class="inner-block">
            <h4 style="color: #457b9d; margin-bottom: 15px;">УСЛУГИ</h4>
            <p><strong>💻 Сайт-визитка</strong><br>3D-дизайн и эффекты.</p>
            <p style="margin-top: 10px;"><strong>📱 Верстка</strong><br>Из Figma в живой код.</p>
        </div>

        <div class="inner-block" style="margin-top: 20px;">
            <h4 style="color: #457b9d;">🧮 КАЛЬКУЛЯТОР</h4>
            <input type="number" id="goalInput" placeholder="Цена мечты" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; outline:none;">
            <button onclick="calculate()" class="btn-send" style="margin-top:10px;">Рассчитать</button>
            <p id="calcResult" style="margin-top:10px; font-size:0.9rem; font-weight:bold;"></p>
        </div>
    </div>


    <!-- БЛОК 3: МЕЧТА -->
     <div class="inner-block" style="border: 2px solid #ffd700; background: linear-gradient(to bottom, #fff, #fff9e6);">
            <div style="font-size: 2rem;">🐶</div>
            <h5>GOLD PROJECT: Portfolio</h5>
            <p style="font-size: 0.7rem; color: #666;">Мой первый серьезный проект.</p>
        </div>
    </div>
        
   
   
    <p style="margin-top:30px; font-size:0.7rem; color:#999;">Разработано Ваней (Sahivan-14) © 2026</p>
    </div>

    <script>
        const c = document.querySelector('.cursor');
        const f = document.querySelector('.cursor-follower');
        const cards = document.querySelectorAll('.card');

        document.addEventListener('mousemove', e => {
    const x = e.clientX;
    const y = e.clientY;

    // 1. Движение курсора (всегда активно)
    c.style.left = f.style.left = x + 'px';
    c.style.top = f.style.top = y + 'px';

    // 2. Движение карточек (ТОЛЬКО при наведении)
    cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        
        // ПРОВЕРКА: находится ли мышка ВНУТРИ границ карточки
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
            // Если мышка НАД карточкой — наклоняем её
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const rotX = -(y - centerY) / 40; // Чувствительность
            const rotY = (x - centerX) / 40;

            card.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.05)`;
        } else {
            // Если мышка ВНЕ карточки — возвращаем её в идеально ровное состояние
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
        }
    });
});
а
        // 3. Искорки при клике
        document.addEventListener('click', e => {
            for(let i=0; i<8; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                document.body.appendChild(p);
                p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
                const dX = (Math.random()-0.5)*200, dY = (Math.random()-0.5)*200;
                setTimeout(() => { p.style.transform = `translate(${dX}px, ${dY}px) scale(0)`; p.style.opacity = 0; }, 10);
                setTimeout(() => p.remove(), 600);
            }
        });

        function calc() {
            const val = document.getElementById('goal').value;
            if(val) document.getElementById('res').innerText = "Нужно копить по " + Math.round(val/730) + " руб/день";
        }
    </script>
</body>
