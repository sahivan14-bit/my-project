<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahivan-14 | LUX Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-icons"></div>
    
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="container">
        <!-- БЛОК 1: ТЫ -->
        <div class="card reveal">
    <div class="avatar"><img src="png.jpg" alt="Мопс"></div>
    <h1 class="title">ДОБРЫЙ ДЕНЬ, ВАНЯ!</h1>
    
    <!-- Твой новый текст над кнопкой -->
    <p style="font-size: 0.85rem; color: #666; font-weight: 500; margin-bottom: 10px;">

    </p>
    
    <a href="https://t.me" class="btn-send animate-btn">Написать мне</a>
    
    <!-- Навыки в рамочке -->
    <div class="inner-block skills-border">
        <h4 class="block-label">МОИ НАВЫКИ</h4>
        
        <p class="stat-text">HTML - <span class="num" data-val="90">0</span>%</p>
        <div class="progress-bg"><div class="bar html"></div></div>
        
        <p class="stat-text">CSS - <span class="num" data-val="80">0</span>%</p>
        <div class="progress-bg"><div class="bar css"></div></div>
        
        <!-- Добавили JavaScript -->
        <p class="stat-text">JavaScript - <span class="num" data-val="45">0</span>%</p>
        <div class="progress-bg"><div class="bar js"></div></div>
    </div>
</div>


        <!-- БЛОК 2: БИЗНЕС -->
        <div class="inner-block service-container">
    <h4 class="block-label">УСЛУГИ</h4>
    
    <!-- Услуга 1 -->
    <div class="service-item">
        <span class="icon">💻</span>
        <span class="service-name">3D Сайт-визитка</span>
    </div>

    <!-- Услуга 2 -->
    <div class="service-item">
        <span class="icon">📱</span>
        <span class="service-name">Верстка под ключ</span>
    </div>
</div>

<!-- ТВОЙ РАЗДЕЛИТЕЛЬ С ТЕМНОЙ МОЛНИЕЙ -->
<div class="divider dark-divider">
    <span class="divider-line dark-line"></span>
    <span class="divider-icon">⚡</span>
    <span class="divider-line dark-line"></span>
</div>

<!-- КАРТОЧКА КАЛЬКУЛЯТОРА -->
<div class="card reveal solid-calc">
    <div class="inner-block">
        <h4 class="block-label">🧮 КАЛЬКУЛЯТОР</h4>
        <input type="number" id="inp" placeholder="Цена мечты" class="main-input solid-input">
        <button onclick="calc()" class="btn-send shine-btn small-btn">Рассчитать</button>
        <p id="res" class="calc-res"></p>
    </div>
</div>

<!-- ПОРТФОЛИО (БЕЗ РАСТЯГИВАНИЯ) -->
<div class="card reveal fire-card"> <!-- Добавили магию огня -->
    <h3 class="title" style="color: #1d3557; margin-bottom: 10px;">ПУТЬ К 16 ГОДАМ</h3>
    <p class="goal-text" style="font-weight: bold; font-size: 0.9rem;">
        🏠 ЖК Иртыш съемная квартира| 🏎️ AMG GT
    </p>
    
    <!-- ЗОЛОТАЯ РАМКА С ТЕНЬЮ -->
    <div class="inner-block premium-border">
        <div class="emoji-icon" style="font-size: 2.5rem; margin-bottom: 10px;">🐶</div>
        <h5 style="margin: 10px 0; letter-spacing: 1px;">GOLD PROJECT: Portfolio</h5>
        
        <!-- Кнопка GitHub с блеском -->
        <a href="https://github.com" target="_blank" class="btn-send github-btn shine-btn">
            GitHub
        </a>
    </div>
</div>
<!-- ПАСХАЛКА: ПАНЕЛЬ УПРАВЛЕНИЯ AMG -->
<div class="nitro-section" style="margin-top: 50px; text-align: center; padding-bottom: 100px;">
    <p style="color: rgba(255,255,255,0.4); font-size: 0.7rem; letter-spacing: 2px;">SYSTEM STATUS: READY</p>
    <button id="nitroBtn" class="btn-send" style="background: #111; border: 1px solid #333; font-size: 0.7rem; width: auto; display: inline-block; padding: 10px 20px;">
        ВКЛЮЧИТЬ NITRO 🚀
    </button>
</div>


    <script src="script.js"></script>
</body>
</html>
<script>
window.onload = () => {
    const cards = document.querySelectorAll('.card');
    const c = document.querySelector('.cursor');
    const f = document.querySelector('.cursor-follower');

    // КУРСОР И 3D НАКЛОН
    document.addEventListener('mousemove', (e) => {
        const x = e.clientX, y = e.clientY;
        c.style.left = f.style.left = x + 'px';
        c.style.top = f.style.top = y + 'px';

        cards.forEach(card => {
            const r = card.getBoundingClientRect();
            if (x > r.left && x < r.right && y > r.top && y < r.bottom) {
                const rx = -(y - (r.top + r.height/2)) / 15;
                const ry = (x - (r.left + r.width/2)) / 15;
                card.style.setProperty('--rx', `${rx}deg`);
                card.style.setProperty('--ry', `${ry}deg`);
                card.style.setProperty('--s', `1.04`);
            } else {
                card.style.setProperty('--rx', `0deg`);
                card.style.setProperty('--ry', `0deg`);
                card.style.setProperty('--s', `1`);
            }
        });
    });

    // ИСКРЫ ПРИ КЛИКЕ
    document.addEventListener('click', (e) => {
        for(let i=0; i<10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            document.body.appendChild(p);
            p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
            const dX = (Math.random()-0.5)*250, dY = (Math.random()-0.5)*250;
            setTimeout(() => { p.style.transform = `translate(${dX}px, ${dY}px) scale(0)`; p.style.opacity = 0; }, 10);
            setTimeout(() => p.remove(), 600);
        }
    });

    // АНИМАЦИЯ ЦИФР И ПОЛОСОК
    document.querySelectorAll('.num').forEach(n => {
        let target = +n.getAttribute('data-val'), count = 0;
        let t = setInterval(() => { n.innerText = ++count; if(count >= target) clearInterval(t); }, 20);
    });
    document.querySelectorAll('.bar').forEach(b => {
        const val = b.parentElement.previousElementSibling.querySelector('.num').getAttribute('data-val');
        setTimeout(() => { b.style.width = val + '%'; }, 100);
    });
};

function calc() {
    const v = document.getElementById('inp').value;
    if(v) document.getElementById('res').innerText = "Нужно: " + Math.round(v/730) + " руб/день";
}
const nitroBtn = document.getElementById('nitroBtn');

nitroBtn.addEventListener('click', () => {
    // Включаем эффекты
    document.body.classList.add('nitro-active');
    nitroBtn.classList.add('btn-nitro-on');
    nitroBtn.innerText = "NITRO ACTIVE! 🔥";

    // Автоматическое выключение через 5 секунд
    setTimeout(() => {
        document.body.classList.remove('nitro-active');
        nitroBtn.classList.remove('btn-nitro-on');
        nitroBtn.innerText = "ВКЛЮЧИТЬ NITRO 🚀";
    }, 5000);
    
    // Доп. фишка: куча искр при нажатии
    for(let i=0; i<30; i++) {
        createParticle(window.innerWidth/2, window.innerHeight - 100);
    }
});

// Вспомогательная функция для искр (если её нет)
function createParticle(x, y) {
    const p = document.createElement('div');
    p.className = 'particle';
    document.body.appendChild(p);
    p.style.left = x + 'px'; p.style.top = y + 'px';
    const dX = (Math.random()-0.5)*400, dY = (Math.random()-0.5)*400;
    setTimeout(() => { p.style.transform = `translate(${dX}px, ${dY}px) scale(0)`; p.style.opacity = 0; }, 10);
    setTimeout(() => p.remove(), 1000);
}

function createBgEmoji() {
    const container = document.querySelector('.floating-icons');
    if (!container) return; // Если контейнера нет, выходим, чтобы не было ошибки

    const emojis = ['🐶', '🏠', '🏎️', '💻', '💰', '🔥'];
    const emoji = document.createElement('div');
    emoji.className = 'bg-emoji';
    
    emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    emoji.style.left = Math.random() * 100 + 'vw';
    
    const size = Math.random() * (3 - 1) + 1;
    emoji.style.fontSize = size + 'rem';
    
    // Случайная скорость взлета
    const duration = Math.random() * (20 - 10) + 10;
    emoji.style.animation = `float-bg ${duration}s linear infinite`;
    
    container.appendChild(emoji);
    
    // Удаляем через 20 секунд, чтобы сайт не тормозил
    setTimeout(() => { emoji.remove(); }, 20000);
}

// Запускаем через секунду после загрузки, чтобы всё успело появиться
setTimeout(() => {
    setInterval(createBgEmoji, 2000);
}, 1000);

</script>
</body>
</html>
