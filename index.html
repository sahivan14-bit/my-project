<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahivan-14 | LUX</title>
    <style>
        body {
            background: #0f172a;
            margin: 0; font-family: sans-serif;
            display: flex; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
            cursor: none;
        }
        .container { display: flex; flex-direction: column; align-items: center; padding: 50px 20px; width: 100%; }
        
        /* ГЛАВНЫЙ СЕКРЕТ 3D */
        .card {
            background: white; padding: 40px; border-radius: 40px;
            margin-bottom: 50px; width: 100%; max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            
            /* Эти настройки делают наклон БЕТОННЫМ */
            transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--s, 1));
            transition: transform 0.1s ease-out;
            will-change: transform;
            cursor: none;
        }

        .avatar img { width: 140px; height: 140px; border-radius: 50%; border: 5px solid #fff; object-fit: cover; }
        
        .cursor, .cursor-follower {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 10000;
            top: 0; left: 0; transform: translate(-50%, -50%);
        }
        .cursor { width: 8px; height: 8px; background: #e63946; }
        .cursor-follower { width: 35px; height: 35px; border: 2px solid #e63946; transition: 0.1s; }
        
        .btn-send { background: #e63946; color: white !important; padding: 15px; border-radius: 20px; display: block; text-decoration: none; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="container">
        <div class="card">
            <img src="png.jpg" class="avatar" style="width: 140px; height: 140px; border-radius: 50%;">
            <h2>ВАНИН ПРОЕКТ</h2>
            <a href="#" class="btn-send">Написать мне</a>
        </div>
        
        <div class="card">
            <h3>КАЛЬКУЛЯТОР</h3>
            <input type="number" id="goal" style="width: 80%; padding: 10px; border-radius: 10px; border: 1px solid #ddd;">
            <button onclick="calc()" class="btn-send" style="width: 90%; margin: 10px auto; border: none;">Считать</button>
            <p id="res"></p>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.card');
        const c = document.querySelector('.cursor');
        const f = document.querySelector('.cursor-follower');

        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            // Курсор всегда работает
            c.style.left = f.style.left = x + 'px';
            c.style.top = f.style.top = y + 'px';

            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                
                // Если мышка ВНУТРИ карточки
                if (x > rect.left && x < rect.right && y > rect.top && y < rect.bottom) {
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // Наклон
                    const rx = -(y - centerY) / 10;
                    const ry = (x - centerX) / 10;

                    card.style.setProperty('--rx', `${rx}deg`);
                    card.style.setProperty('--ry', `${ry}deg`);
                    card.style.setProperty('--s', `1.05`);
                } else {
                    card.style.setProperty('--rx', `0deg`);
                    card.style.setProperty('--ry', `0deg`);
                    card.style.setProperty('--s', `1`);
                }
            });
        });

        function calc() {
            const v = document.getElementById('goal').value;
            if(v) document.getElementById('res').innerText = "Нужно: " + Math.round(v/730) + " р/д";
        }
    </script>
</body>
</html>
