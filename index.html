<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahivan-14 | LUX Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="container">
        <!-- БЛОК 1: ТЫ -->
        <div class="card reveal">
            <div class="avatar"><img src="png.jpg" alt="Мопс"></div>
            <h1 class="title">ДОБРЫЙ ДЕНЬ, ВАНЯ!</h1>
            <a href="https://t.me" class="btn-send">Написать мне</a>
            
            <div class="inner-block">
                <h4 class="block-label">МОИ НАВЫКИ</h4>
                <p class="stat-text">HTML - <span class="num" data-val="90">0</span>%</p>
                <div class="progress-bg"><div class="bar html"></div></div>
                <p class="stat-text">CSS - <span class="num" data-val="80">0</span>%</p>
                <div class="progress-bg"><div class="bar css"></div></div>
            </div>
        </div>

        <!-- БЛОК 2: БИЗНЕС -->
        <div class="card reveal">
            <div class="inner-block">
                <h4 class="block-label">УСЛУГИ</h4>
                <p class="service-text">💻 3D Сайт-визитка<br>📱 Верстка под ключ</p>
            </div>
            <div class="inner-block">
                <h4 class="block-label">КАЛЬКУЛЯТОР</h4>
                <input type="number" id="inp" placeholder="Цена мечты" class="main-input">
                <button onclick="calc()" class="btn-send" style="width: 100%; border: none;">Рассчитать</button>
                <p id="res" class="calc-res"></p>
            </div>
        </div>

        <!-- БЛОК 3: ПОРТФОЛИО -->
        <div class="card reveal">
            <h3 class="title">ПУТЬ К 16 ГОДАМ</h3>
            <p class="goal-text">🏠 ЖК Иртыш | 🏎️ AMG GT</p>
            <div class="inner-block gold-border">
                <div class="emoji-icon">🐶</div>
                <h5>GOLD PROJECT: Portfolio</h5>
                <a href="https://github.com" target="_blank" class="btn-send secondary-btn">GitHub</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
<script>
window.onload = () => {
    const cards = document.querySelectorAll('.card');
    const c = document.querySelector('.cursor');
    const f = document.querySelector('.cursor-follower');

    // КУРСОР И 3D НАКЛОН
    document.addEventListener('mousemove', (e) => {
        const x = e.clientX, y = e.clientY;
        c.style.left = f.style.left = x + 'px';
        c.style.top = f.style.top = y + 'px';

        cards.forEach(card => {
            const r = card.getBoundingClientRect();
            if (x > r.left && x < r.right && y > r.top && y < r.bottom) {
                const rx = -(y - (r.top + r.height/2)) / 15;
                const ry = (x - (r.left + r.width/2)) / 15;
                card.style.setProperty('--rx', `${rx}deg`);
                card.style.setProperty('--ry', `${ry}deg`);
                card.style.setProperty('--s', `1.04`);
            } else {
                card.style.setProperty('--rx', `0deg`);
                card.style.setProperty('--ry', `0deg`);
                card.style.setProperty('--s', `1`);
            }
        });
    });

    // ИСКРЫ ПРИ КЛИКЕ
    document.addEventListener('click', (e) => {
        for(let i=0; i<10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            document.body.appendChild(p);
            p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
            const dX = (Math.random()-0.5)*250, dY = (Math.random()-0.5)*250;
            setTimeout(() => { p.style.transform = `translate(${dX}px, ${dY}px) scale(0)`; p.style.opacity = 0; }, 10);
            setTimeout(() => p.remove(), 600);
        }
    });

    // АНИМАЦИЯ ЦИФР И ПОЛОСОК
    document.querySelectorAll('.num').forEach(n => {
        let target = +n.getAttribute('data-val'), count = 0;
        let t = setInterval(() => { n.innerText = ++count; if(count >= target) clearInterval(t); }, 20);
    });
    document.querySelectorAll('.bar').forEach(b => {
        const val = b.parentElement.previousElementSibling.querySelector('.num').getAttribute('data-val');
        setTimeout(() => { b.style.width = val + '%'; }, 100);
    });
};

function calc() {
    const v = document.getElementById('inp').value;
    if(v) document.getElementById('res').innerText = "Нужно: " + Math.round(v/730) + " руб/день";
}
</script>
</body>
</html>
