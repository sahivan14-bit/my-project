<!-- Твой курсор -->
<div class="cursor"></div>
<div class="cursor-follower"></div>

<div class="container">
    
    <!-- КАРТОЧКА 1: ВИЗИТКА И НАВЫКИ -->
    <div class="card">
        <div class="avatar"><img src="png.jpg" alt="Мопс"></div>
        <h1 style="font-size: 1.4rem; color: #1d3557; margin-top: 15px;">ДОБРЫЙ ДЕНЬ, ВАНЯ!</h1>
        <p style="color: #666; font-size: 0.85rem; margin-bottom: 20px;">Будущий Fullstack-разработчик.</p>
        <a href="https://t.me" class="btn-send">Написать мне</a>

        <div class="inner-block">
            <h4 style="color: #457b9d; font-size: 0.8rem; margin-bottom: 10px;">МОИ НАВЫКИ</h4>
            <div class="progress-bg"><div class="progress-fill html" style="width: 90%;"></div></div>
            <div class="progress-bg"><div class="progress-fill css" style="width: 80%;"></div></div>
            <div class="progress-bg"><div class="progress-fill js" style="width: 40%;"></div></div>
        </div>
    </div>

    <!-- КАРТОЧКА 2: БИЗНЕС И УСЛУГИ -->
    <div class="card">
        <div class="inner-block">
            <h4 style="color: #457b9d; margin-bottom: 15px;">УСЛУГИ</h4>
            <p><strong>💻 Сайт-визитка</strong><br>3D-дизайн и эффекты.</p>
            <p style="margin-top: 10px;"><strong>📱 Верстка</strong><br>Из Figma в живой код.</p>
        </div>

        <div class="inner-block" style="margin-top: 20px;">
            <h4 style="color: #457b9d;">🧮 КАЛЬКУЛЯТОР ЦЕЛИ</h4>
            <input type="number" id="goalInput" placeholder="Цена мечты" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; outline:none; box-sizing: border-box;">
            <button onclick="calculate()" class="btn-send" style="margin-top:10px;">Рассчитать</button>
            <p id="calcResult" style="margin-top:10px; font-size:0.85rem; font-weight:bold; color:#1d3557;"></p>
        </div>
    </div>

    <!-- КАРТОЧКА 3: ТВОИ ЦЕЛИ И ПОРТФОЛИО -->
    <div class="card">
        <h3 style="color: #1d3557; margin-bottom: 10px;">ПУТЬ К 16 ГОДАМ</h3>
        <p style="font-size: 0.85rem; font-weight: bold;">🏠 ЖК Иртыш | 🏎️ AMG GT</p>
        
        <div class="inner-block" style="border: 2px solid #ffd700; background: linear-gradient(to bottom, #fff, #fff9e6); margin-top: 20px;">
            <div style="font-size: 2rem;">🐶</div>
            <h5>GOLD PROJECT: Portfolio</h5>
            <p style="font-size: 0.75rem; color: #666;">Мой первый серьезный проект в сети.</p>
        </div>
    </div>

</div>

<script>
    const c = document.querySelector('.cursor');
    const f = document.querySelector('.cursor-follower');
    const cards = document.querySelectorAll('.card');

    document.addEventListener('mousemove', e => {
        const x = e.clientX;
        const y = e.clientY;

        // 1. Плавный курсор
        c.style.left = f.style.left = x + 'px';
        c.style.top = f.style.top = y + 'px';

        // 2. 3D наклон ТОЛЬКО ПРИ НАВЕДЕНИИ
        cards.forEach(card => {
            const rect = card.getBoundingClientRect();
            if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                // Мягкий наклон (делим на 35)
                const rotX = -(y - centerY) / 35;
                const rotY = (x - centerX) / 35;
                card.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
            } else {
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
            }
        });
    });

    function calculate() {
        const val = document.getElementById('goalInput').value;
        const res = document.getElementById('calcResult');
        if(val) res.innerText = "Нужно откладывать всего " + Math.round(val/730) + " руб/день!";
    }
</script>
